spring.application.name=categories-service

spring.config.import=optional:sm://
spring.cloud.gcp.secretmanager.project-id=gcloud-website-deploy

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Supabase PostgreSQL Database
spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres.jeqauqgprdexvzakaese
spring.datasource.password=${sm://projects/gcloud-website-deploy/secrets/SUPABASE_DB_PASSWORD}

# Server
server.port=${PORT:8080}

server.forward-headers-strategy=framework

app.openapi.title=Category Service API
app.openapi.description=REST API for managing Category Information
app.openapi.version=1.0.0

cors.allowed-origins=${sm://CORS_ALLOWED_ORIGINS:http://localhost:4200}
