spring.application.name=categories-service

# H2 Database
spring.datasource.url=jdbc:h2:mem:categories_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Load data.sql after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=${PORT:8080}

server.forward-headers-strategy=framework

app.openapi.title=Category Service API
app.openapi.description=REST API for managing Category Information
app.openapi.version=1.0.0

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://medicareplus-970647939758.us-central1.run.app}
